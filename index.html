<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>3개 국어 듣기</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="3개국어"><meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
:root{--bg:#f6f5f1;--card:#fff;--fg:#1d1d1b;--mut:#6d6b65;--line:#e2dfd7;--ac:#1f6f5c;--on:#fff;--hl:#e2f1ec}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--fg:#eeece6;--mut:#a19e96;--line:#34332f;--ac:#5cc3a8;--on:#10201c;--hl:#1c332d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif}
.top{position:sticky;top:0;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line)}
.top,#sc{max-width:560px;margin:0 auto}.row{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px}h1{font-size:16px;margin:0}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px}
button[aria-pressed=true],#play{background:var(--ac);color:var(--on);border-color:var(--ac)}#play{flex:1;font-weight:600}
progress{width:100%;height:6px;accent-color:var(--ac)}details{font-size:14px;color:var(--mut)}details label{display:block;margin-top:8px}details select{width:100%}
#sc{padding:8px 14px 60vh}.ln{padding:10px 12px;border-radius:12px;margin:4px 0;cursor:pointer}
.ln.t{font-size:21px;font-weight:600}.ln small{display:block;font-size:14px;font-weight:400;color:var(--mut)}.ln.n{font-size:17px}.ln.n small{margin-top:4px}
#sc[data-view=t] small{display:none}#sc[data-view=ko] .tx{display:none}#sc[data-view=ko] small{font-size:inherit;color:var(--fg);margin:0}.ln.now{background:var(--hl);color:var(--fg)}

.ln .pr{display:block;font-size:15px;font-weight:400;color:var(--ac);margin-top:3px}.ln.n .pr{font-size:14px}
#sc[data-pr=off] .pr{display:none}#sc[data-view=ko] .pr{display:none}audio{width:100%;margin-bottom:6px}.chk{font-size:14px;display:flex;gap:6px;align-items:center}
[hidden]{display:none!important}.top{padding-top:calc(12px + env(safe-area-inset-top));z-index:2}
#home{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 14px}#home h1{font-size:22px;margin:0 0 14px}
#list button{display:block;width:100%;text-align:left;padding:16px;margin-bottom:8px}#list small,#home p{display:block;color:var(--mut);font-size:14px}</style></head><body>
<main id="home"><h1>3개 국어 듣기</h1><div id="list"></div><p>아이폰: Safari의 공유 버튼 → "홈 화면에 추가"</p></main>
<section id="player" hidden>
<div class="top"><div class="row"><button id="back">‹ 목록</button><h1 id="title"></h1><div id="langs"><button data-l="en">EN</button> <button data-l="ja">日</button> <button data-l="zh">中</button></div></div>
<audio id="au" controls preload="metadata" playsinline></audio>
<div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button data-v="both">한/영</button><button data-v="t" id="vtl">영</button><button data-v="ko">한</button><button id="prb">한/발음</button><button id="talk">대화</button></div>
<div class="row" style="justify-content:flex-start"><label class="chk">속도 <select id="rate"><option value="0.7">0.7배</option><option value="0.8">0.8배</option><option value="0.9">0.9배</option><option value="1.0">1.0배</option><option value="1.1">1.1배</option><option value="1.2">1.2배</option><option value="1.3">1.3배</option></select></label><label class="chk"><input type="checkbox" id="loop">반복</label><button id="save">저장</button></div></div>
<div id="sc"></div></section>
<script src="app.js"></script></body></html>
