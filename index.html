<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>한 장면, 세 언어</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="세 언어"><meta name="theme-color" content="#1b2a4a">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>:root{--bg:#f4f4f2;--card:#fff;--fg:#14213a;--mut:#667085;--line:#dcdcd6;--ac:#1b2a4a;--ac2:#a8864a;--gold:#8a6a2f;--on:#fff;--hl:#f3ecdd;--seg:#e8e8e3;--sh:0 1px 2px rgba(20,33,58,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1524;--card:#172033;--fg:#ebe7dc;--mut:#98a1b5;--line:#2a354d;--ac:#c9a86a;--ac2:#c9a86a;--gold:#c9a86a;--on:#131b2c;--hl:#26304a;--seg:#222c42;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,"Apple SD Gothic Neo",sans-serif}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.top{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.top,#sc{max-width:560px;margin:0 auto}
.head{display:flex;align-items:center;gap:6px;margin-bottom:10px}.head h1{flex:1;font-size:19px}
#back{width:36px;height:40px;margin-left:-8px;font-size:28px;line-height:1;color:var(--ac)}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:34px;min-width:42px;padding:0 10px;border-radius:9px;color:var(--mut);font-size:15px;font-weight:600;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ac);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tools{display:flex;gap:6px;justify-content:space-between}
.chip{min-height:40px;padding:0 11px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--mut);white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--on)}
#sc{padding:10px 12px calc(55vh + 120px)}
.ln{padding:13px 15px;border-radius:16px;margin:8px 0;cursor:pointer;border:1px solid transparent}
.ln.t{position:relative;padding-left:42px;background:var(--card);box-shadow:var(--sh);font-size:calc(21px*var(--z,1));font-weight:650;line-height:1.4}
.ln.n{font-size:calc(16px*var(--z,1))}.ln.gap{color:var(--mut);text-align:center;font-size:14px}
.ln.now{background:var(--hl);border-color:var(--ac2)}
.ln small{display:block;font-size:calc(14px*var(--z,1));font-weight:400;color:var(--mut);margin-top:3px}
.ln .pr{display:block;font-size:calc(15px*var(--z,1));font-weight:500;color:var(--ac);margin-top:4px}.ln.n .pr{font-size:calc(14px*var(--z,1))}
#sc[data-view=t] small{display:none}#sc[data-view=ko] .tx,#sc[data-view=ko] .pr,#sc[data-pr=off] .pr{display:none}
#sc[data-view=ko] small{font-size:inherit;color:var(--fg);margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:3;max-width:560px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);padding:8px 18px calc(10px + env(safe-area-inset-bottom))}
.time{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#seek{flex:1;height:28px;margin:0;accent-color:var(--ac)}
.ctl{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;justify-items:center;margin-top:2px}
#play{grid-column:3;width:60px;height:60px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 16px rgba(20,33,58,.28)}
#play svg{width:28px;height:28px;fill:currentColor}#play .pause,#play.on .go{display:none}#play.on .pause{display:block}
.side{min-height:44px;min-width:52px;border-radius:12px;font-size:14px;font-weight:600;color:var(--mut)}
select.side{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
.side[aria-pressed=true]{color:var(--ac);background:var(--hl)}
#sc[data-view=ko] .ln small{font-size:inherit}
.star{position:absolute;left:2px;top:8px;width:40px;height:44px;padding:0;font-size:22px;line-height:44px;color:var(--mut)}
.star[aria-pressed=true]{color:#b8903f}.ln.inab{border-left:4px solid #b8903f}
.fs{min-width:34px;height:38px;padding:0;font-size:14px;font-weight:700;color:var(--mut)}.fs:disabled{opacity:.3}
#ab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;background:var(--hl);color:var(--ac);border-radius:10px;padding:2px 4px 2px 12px;margin-bottom:4px}
#abx{min-height:32px;padding:0 10px;font-weight:700}
.rews{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--mut)}.rews .seg button{min-height:30px;font-size:13px}
.top{padding-top:calc(7px + env(safe-area-inset-top));padding-bottom:7px}.head{margin-bottom:6px}
.top .seg{padding:2px;border-radius:9px}.top .seg button{min-height:28px;min-width:34px;padding:0 8px;border-radius:7px;font-size:13px}
.top .chip{min-height:32px;padding:0 10px;border-radius:9px;font-size:13px}.top .fs{min-width:28px;height:30px;font-size:12px}

@font-face{font-family:Myeongjo;src:url(title.woff2) format("woff2");font-weight:700;font-display:swap}
h1,h2{margin:0;font-family:Myeongjo,"AppleMyungjo",serif;font-weight:700}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
#home{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 24px 48px}
.mast{padding-bottom:26px;border-bottom:1px solid var(--fg)}
.util{display:flex;justify-content:flex-end;gap:18px;margin-bottom:44px}.util button{min-height:32px;padding:0;font-size:12px;color:var(--mut)}
.mast h1{font-size:34px;line-height:1.25;letter-spacing:-.02em}
.trio{display:flex;flex-wrap:wrap;gap:4px 20px;margin:12px 0 0;font-family:Myeongjo,"Iowan Old Style","Hiragino Mincho ProN",serif;font-size:15px;color:var(--gold)}
#list button{display:flex;align-items:center;gap:22px;width:100%;text-align:left;padding:24px 0;border-bottom:1px solid var(--line)}
#list[data-level=in] button{padding:18px 0}
#list b{display:block;font-family:Myeongjo,"AppleMyungjo",serif;font-size:20px;font-weight:700}
#list small{display:block;margin-top:5px;color:var(--mut);font-size:13px;line-height:1.55;word-break:keep-all}
.mono{flex:none;width:52px;height:52px;border:1px solid var(--ac2);border-radius:50%;display:grid;place-items:center;font-family:Myeongjo,serif;font-size:24px;color:var(--gold)}
#crumb{display:flex;align-items:center;gap:6px;padding:18px 0 4px}#crumb h2{font-size:22px}#up{width:32px;height:40px;margin-left:-8px;font-size:28px;line-height:1;color:var(--gold)}
#howto{margin:0;padding:16px 0 16px 20px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.8}
.head h1{font-family:Myeongjo,"AppleMyungjo",serif}
.mast h1{font-size:clamp(28px,8.4vw,36px);letter-spacing:-.01em}
</style></head><body>
<main id="home"><header class="mast"><div class="util"><button id="install" hidden>홈 화면에 추가</button><button id="reload">새로고침</button></div>
<h1>한 장면, 세 언어</h1>
<p class="trio"><span lang="en">Hello</span><span lang="ja">こんにちは</span><span lang="zh-CN">你好</span></p></header><ol id="howto" hidden><li>Safari로 이 주소를 엽니다.</li><li>화면의 <b>공유 버튼</b>(네모에 위 화살표)을 누릅니다.</li><li><b>"홈 화면에 추가"</b>를 누릅니다.</li></ol><div id="crumb" hidden><button id="up" aria-label="처음으로">‹</button><h2 id="gname"></h2></div><div id="list"></div></main>
<section id="player" hidden>
<div class="top"><div class="head"><button id="back" aria-label="목록">‹</button><h1 id="title"></h1><button class="fs" id="fsm" aria-label="글씨 작게">가−</button><button class="fs" id="fsp" aria-label="글씨 크게">가+</button><div class="seg" id="langs"><button data-l="en">EN</button><button data-l="ja">日</button><button data-l="zh">中</button></div></div>
<div class="tools"><div class="seg"><button data-v="both">한/영</button><button data-v="t" id="vtl">영</button><button data-v="ko">한</button></div><button class="chip" id="prb">한/발음</button><button class="chip" id="talk">대화</button></div></div>
<div id="sc"></div>
<div class="dock"><div id="ab" hidden><span id="abt"></span><button id="abx">해제</button></div><div class="time"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="0" step="0.1" value="0" aria-label="재생 위치"><span id="dur">0:00</span></div>
<div class="ctl"><select class="side" id="rate" aria-label="속도"><option value="0.7">0.7×</option><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1.0">1.0×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option><option value="1.3">1.3×</option></select><button class="side" id="rew">↺ 5초</button>
<button id="play" aria-label="재생"><svg class="go" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.500 4.640A1 1 0 0 0 8 5.5z"/></svg><svg class="pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
<button class="side" id="loop" aria-pressed="false">반복</button><button class="side" id="save">저장</button></div>
<div class="rews"><span>뒤로 감기</span><div class="seg" id="secs"><button data-s="5">5초</button><button data-s="10">10초</button><button data-s="30">30초</button><button data-s="60">1분</button></div></div></div>
<audio id="au" preload="metadata" playsinline></audio></section>
<script src="app.js"></script></body></html>
